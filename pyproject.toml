[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-sift"
version = "0.1.0"
description = "Advisory alert investigation using an internal model and existing Grafana"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<0.29",
  "pydantic>=2.9,<3", "psycopg[binary]>=3.2,<4", "PyYAML>=6,<7"
]

[project.scripts]
alert-worker = "alert_insight.worker:main"
alert-demo = "alert_insight.demo:main"
alert-migrate = "alert_insight.storage:main"

[tool.setuptools.packages.find]
where = ["src"]
